<!doctype html><html lang="ml"><head><title>malayalamoptional</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Malayalam:wght@400;700&family=Noto+Sans+Malayalam:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script></head><body>
<header class="top"><a class="brand" href="./">malayalamoptional</a></header>
<main id="app"><p class="empty">Loading…</p></main>
<footer>© malayalamoptional</footer>
<script src="config.js"></script>
<script>
const app = document.getElementById("app");
const id = new URLSearchParams(location.search).get("id");
async function showList() {
  const {data, error} = await sb.from("articles").select("id,title,category,created_at").order("created_at", {ascending:false});
  if (error) { app.innerHTML = '<p class="empty">Could not load articles.</p>'; return; }
  app.innerHTML = '<h1>Malayalam Optional notes and articles</h1>' +
    '<div class="search"><input id="q" placeholder="Search by title"><select id="cat"><option value="">All</option>' +
    CATEGORIES.map(c => '<option>' + esc(c) + '</option>').join("") + '</select></div><ul class="list" id="list"></ul>';
  const draw = () => {
    const q = document.getElementById("q").value.toLowerCase(), c = document.getElementById("cat").value;
    const rows = data.filter(r => r.title.toLowerCase().includes(q) && (!c || r.category === c));
    document.getElementById("list").innerHTML = rows.length ? rows.map(r =>
      '<li><a href="?id=' + r.id + '">' + esc(r.title) + '</a><span>' + esc(r.category) + ', ' + fmt(r.created_at) + '</span></li>').join("")
      : '<li class="empty">No articles found.</li>';
  };
  document.getElementById("q").oninput = draw; document.getElementById("cat").onchange = draw; draw();
}
async function showArticle() {
  const {data:a, error} = await sb.from("articles").select("*").eq("id", id).single();
  if (error || !a) { app.innerHTML = '<p class="empty">Article not found. <a href="./">Back</a></p>'; return; }
  document.title = a.title + " | malayalamoptional";
  const url = a.file_path ? sb.storage.from("docx").getPublicUrl(a.file_path).data.publicUrl : null;
  app.innerHTML = '<p><a href="./">All articles</a></p><article><p class="meta">' + esc(a.category) + ', ' + fmt(a.created_at) +
    '</p><h1>' + esc(a.title) + '</h1><div class="content">' + DOMPurify.sanitize(a.html) + '</div>' +
    (url ? '<p><a class="btn" href="' + url + '" download>Download .docx</a></p>' : '') + '</article>';
}
id ? showArticle() : showList();
</script></body></html>
