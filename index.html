<!doctype html><html lang="ml"><head><title>malayalamoptional</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650&family=Noto+Serif+Malayalam:wght@400;700&family=Noto+Sans+Malayalam:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="public.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script></head><body class="pub">
<header class="top"><a class="brand" href="./"><img src="logo.png" alt="" width="70" height="38"><span>malayalamoptional</span></a><nav id="nav"></nav></header>
<main id="app"><p class="empty">Loading…</p></main>
<footer>© malayalamoptional &nbsp; <a href="admin.html">Admin login</a></footer>
<script src="config.js"></script>
<script>
const app = document.getElementById("app");
const id = new URLSearchParams(location.search).get("id");
async function showList() {
  const {data, error} = await sb.from("articles").select("id,title,category,created_at,file_path").order("created_at", {ascending:false});
  if (error) { app.innerHTML = '<p class="empty">Could not load articles.</p>'; return; }
  let cat = "";
  app.innerHTML = '<p class="eyebrow">Study library</p><h1>Malayalam Optional notes and articles</h1>' +
    '<p class="sub">Notes and articles for your preparation, organised by paper.</p>' +
    '<div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>' +
    '<input id="q" type="search" placeholder="Search by title" aria-label="Search by title" autocomplete="off"></div>' +
    '<div class="pills" id="pills" role="group" aria-label="Filter by category">' +
    ["", ...CATEGORIES].map(c => '<button type="button" data-c="' + esc(c) + '" aria-pressed="' + (c === "") + '">' + (c ? esc(c) : "All") + '</button>').join("") + '</div>' +
    '<ul class="list" id="list"></ul>';
  const draw = () => {
    const q = document.getElementById("q").value.toLowerCase();
    const rows = data.filter(r => r.title.toLowerCase().includes(q) && (!cat || r.category === cat));
    document.getElementById("list").innerHTML = rows.length ? rows.map(r =>
      '<li><a href="?id=' + r.id + '">' + esc(r.title) + '</a><span class="chip">' + esc(r.category) + '</span>' + (/\.pdf$/i.test(r.file_path || "") ? '<span class="chip pdf-tag">PDF</span>' : '') + '<span class="date">' + fmt(r.created_at) + '</span></li>').join("")
      : '<li class="empty">No articles found.</li>';
  };
  document.getElementById("q").oninput = draw;
  document.querySelectorAll("#pills button").forEach(b => b.onclick = () => {
    cat = b.dataset.c;
    document.querySelectorAll("#pills button").forEach(x => x.setAttribute("aria-pressed", x === b));
    draw();
  });
  draw();
}
// Show the PDF through a blob URL so the storage host's security headers can't blank the viewer.
async function loadPdf(url) {
  const fr = document.getElementById("pdfv");
  try {
    const buf = await (await fetch(url)).arrayBuffer();
    fr.src = URL.createObjectURL(new Blob([buf], {type: "application/pdf"}));
  } catch (e) { fr.src = url; }
}
// Some Word files (e.g. converted from PDF) have every printed line as its own paragraph.
// Detect that and join the broken lines back into proper paragraphs. Normal files are untouched.
function reflow(html) {
  const box = document.createElement("div"); box.innerHTML = html;
  const END = /[.?!:;)\]"'”’।…]$/, NEWITEM = /^(\d+|[A-Za-z]|[൦-൯]+)[.)]\s/;
  const txt = el => el.textContent.replace(/\s+/g, " ").trim();
  const ps = [...box.children].filter(e => e.tagName === "P" && txt(e));
  const broken = ps.filter(p => txt(p).length < 100 && !END.test(txt(p))).length;
  if (ps.length < 8 || broken / ps.length < 0.4) return html;
  let cur = null, lastLen = 0;
  [...box.children].forEach(el => {
    const t = cur && txt(cur), n = txt(el);
    if (cur && el.tagName === "P" && cur.tagName === "P" && n && t && lastLen < 100 && !END.test(t) && !NEWITEM.test(n)) {
      cur.append(" ", ...el.childNodes); el.remove(); lastLen = n.length;
    } else { cur = el; lastLen = n.length; }
  });
  return box.innerHTML;
}
async function showArticle() {
  const {data:a, error} = await sb.from("articles").select("*").eq("id", id).single();
  if (error || !a) { app.innerHTML = '<p class="empty">Article not found. <a href="./">Back</a></p>'; return; }
  document.title = a.title + " | malayalamoptional";
  document.body.classList.add("reading");
  const isPdf = /\.pdf$/i.test(a.file_path || "");
  const url = a.file_path ? sb.storage.from("docx").getPublicUrl(a.file_path).data.publicUrl : null;
  app.innerHTML = '<a class="back" href="./">← All articles</a><article><p class="meta"><span class="chip">' + esc(a.category) + '</span><span class="date">' + fmt(a.created_at) +
    '</span></p><h1>' + esc(a.title) + '</h1>' + (isPdf ? '<div class="content pdf"><iframe id="pdfv" title="' + esc(a.title) + '"></iframe></div>'
                      : '<div class="content">' + reflow(DOMPurify.sanitize(a.html)) + '</div>') +
    (url ? '<p><a class="btn" href="' + url + '"' + (isPdf ? ' target="_blank" rel="noopener">Open PDF' : ' download>Download .docx') + '</a></p>' : '') + '</article>';
  if (isPdf) loadPdf(url);
}
function cfgProblem() {
  try { if (!sb) return "Setup error."; }
  catch (e) { return "config.js did not load or has a mistake. Upload config.js into the same GitHub folder as this page, and make sure the URL and key are inside quotes."; }
  if (SUPABASE_URL.includes("YOUR-PROJECT") || SUPABASE_ANON_KEY.includes("YOUR-ANON"))
    return "config.js still has the placeholder text. Put your real Supabase Project URL and publishable key in it, then upload it again.";
  return "";
}
function showProblem(m) { app.innerHTML = '<p class="flash"></p>'; app.firstChild.textContent = m; }
const bad = cfgProblem();
if (bad) showProblem(bad); else (id ? showArticle() : showList());
if (!bad) sb.auth.getSession().then(({data:{session}}) => {
  if (!session) return;
  const nav = document.getElementById("nav");
  nav.innerHTML = '<a href="admin.html"><b>Upload article</b></a><a href="#" id="out">Log out</a>';
  document.getElementById("out").onclick = async e => { e.preventDefault(); await sb.auth.signOut(); location.reload(); };
});
</script></body></html>
