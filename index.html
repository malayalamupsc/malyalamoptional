// Articles + collections. Falls back gracefully if the collections SQL has not been run yet.
async function loadAll() {
  const ord = {ascending: false};
  const [r0, f] = await Promise.all([   // both requests at the same time
    sb.from("articles").select("id,title,category,created_at,file_path,folder_id").order("created_at", ord),
    sb.from("folders").select("*").order("created_at")]);
  let r = r0;
  if (r.error) r = await sb.from("articles").select("id,title,category,created_at,file_path").order("created_at", ord);
  return {articles: r.data || [], error: r.error, folders: f.error ? [] : (f.data || [])};
}
// Stale-while-revalidate: paint instantly from the last visit, then refresh quietly in the background.
async function swr(key, fetcher, paint) {
  let c = null; try { c = JSON.parse(localStorage.getItem(key)); } catch (e) {}
  if (c) paint(c);
  let fresh = null; try { fresh = await fetcher(); } catch (e) {}
  if (!fresh) { if (!c) paint(null); return; }
  try { localStorage.setItem(key, JSON.stringify(fresh)); } catch (e) {}
  if (!c || JSON.stringify(c) !== JSON.stringify(fresh)) paint(fresh);
}
const listData = async () => { const d = await loadAll(); return d.error ? null : d; };
function showList() { swr("ml:list", listData, d => {
  if (document.getElementById("q") && document.getElementById("q").value) return;   // don't disturb an active search
  if (!d) { app.innerHTML = '<p class="empty">Could not load articles.</p>'; return; }

  document.body.classList.add("home");
  let cat = "";
  app.innerHTML = '<p class="eyebrow">Study library</p><h1>Malayalam Optional notes and articles</h1>' +
    '<p class="sub">Notes and articles for your preparation, organised by paper.</p>' +
    '<div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>' +
    '<input id="q" type="search" placeholder="Search by title" aria-label="Search by title" autocomplete="off"></div>' +
    '<div class="pills" id="pills" role="group" aria-label="Filter by category">' +
    ["", ...CATEGORIES].map(c => '<button type="button" data-c="' + esc(c) + '" aria-pressed="' + (c === "") + '">' + (c ? esc(c) : "All") + '</button>').join("") + '</div>' +

  const empty = '<li class="empty">No articles found.</li>';
  const draw = () => {
    const q = document.getElementById("q").value.toLowerCase(), out = document.getElementById("results");
    if (q || cat) {   // searching or filtering: flat list across everything
      const rows = data.filter(r => r.title.toLowerCase().includes(q) && (!cat || r.category === cat));
      out.innerHTML = '<ul class="list">' + (rows.length ? rows.map(rowHtml).join("") : empty) + '</ul>';
      return;

    const inFolder = r => r.folder_id && folders.some(f => f.id === r.folder_id);
    const loose = data.filter(r => !inFolder(r));
    let h = "";
    if (folders.length) h += '<h2 class="section">Collections</h2><div class="cards">' + folders.map(f => cardHtml({
      href: "?folder=" + f.id, title: f.name, desc: f.description, btn: f.button_text, img: cardImgUrl(f.image_path),
      badge: countLabel(data.filter(r => r.folder_id === f.id).length)})).join("") + '</div>';
    if (loose.length || !folders.length) h += (folders.length ? '<h2 class="section">Articles</h2>' : '') +
      '<ul class="list">' + (loose.length ? loose.map(rowHtml).join("") : empty) + '</ul>';
    out.innerHTML = h;
  };
  document.getElementById("q").oninput = draw;
  document.querySelectorAll("#pills button").forEach(b => b.onclick = () => {
    cat = b.dataset.c;
    document.querySelectorAll("#pills button").forEach(x => x.setAttribute("aria-pressed", x === b));
    draw();
  });
  draw();
}); }
function showFolder() { swr("ml:list", listData, d => {

    '<ul class="list">' + (rows.length ? rows.map(rowHtml).join("") : '<li class="empty">Nothing here yet.</li>') + '</ul>';
}); }
// Show the PDF through a blob URL so the storage host's security headers can't blank the viewer.
async function loadPdf(url) {
  const fr = document.getElementById("pdfv");
  try {
    const buf = await (await fetch(url)).arrayBuffer();
    fr.src = URL.createObjectURL(new Blob([buf], {type: "application/pdf"}));
  } catch (e) { fr.src = url; }
}
// Some Word files (e.g. converted from PDF) have every printed line as its own paragraph.
// Detect that and join the broken lines back into proper paragraphs. Normal files are untouched.
function reflow(html) {
  const box = document.createElement("div"); box.innerHTML = html;
  const END = /[.?!:;)\]"'”’।…]$/, NEWITEM = /^(\d+|[A-Za-z]|[൦-൯]+)[.)]\s/;
  const txt = el => el.textContent.replace(/\s+/g, " ").trim();
  const ps = [...box.children].filter(e => e.tagName === "P" && txt(e));
  const broken = ps.filter(p => txt(p).length < 100 && !END.test(txt(p))).length;
  if (ps.length < 8 || broken / ps.length < 0.4) return html;
  let cur = null, lastLen = 0;
  [...box.children].forEach(el => {
    const t = cur && txt(cur), n = txt(el);
    if (cur && el.tagName === "P" && cur.tagName === "P" && n && t && lastLen < 100 && !END.test(t) && !NEWITEM.test(n)) {
      cur.append(" ", ...el.childNodes); el.remove(); lastLen = n.length;
    } else { cur = el; lastLen = n.length; }
  });
  return box.innerHTML;
}
const EDIT_ICON = '<button type="button" id="editBtn" class="edit-btn" title="Edit" aria-label="Edit article"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>';
let loggedIn = false;
function showArticle() { swr("ml:art:" + id, async () => {
  const [{data:a, error}, {data:{session}}] = await Promise.all([sb.from("articles").select("*").eq("id", id).single(), sb.auth.getSession()]);
  if (error || !a) return error && error.code !== "PGRST116" ? null : {missing: true};
  let fo = null;
  if (a.folder_id) { const r = await sb.from("folders").select("id,name").eq("id", a.folder_id).maybeSingle(); fo = r.data; }
  return {a, fo};
}, d => {
  if (document.querySelector(".content.editing")) return;   // never overwrite text being edited
  if (!d || d.missing) { app.innerHTML = '<p class="empty">Article not found. <a href="./">Back</a></p>'; return; }
  const {a, fo} = d;
  document.title = a.title + " | malayalamoptional";
  document.body.classList.add("reading");
  const isPdf = /\.pdf$/i.test(a.file_path || "");
  const url = a.file_path ? sb.storage.from("docx").getPublicUrl(a.file_path).data.publicUrl : null;
  const canEdit = !!loggedIn && !isPdf;
  let back = '<a class="back" href="./">← All articles</a>';
  if (fo) back = '<a class="back" href="?folder=' + esc(fo.id) + '">← ' + esc(fo.name) + '</a>';
  app.innerHTML = back + '<article><p class="meta"><span class="chip">' + esc(a.category) + '</span><span class="date">' + fmt(a.created_at) +
    '</span></p><h1>' + esc(a.title) + '</h1>' + (isPdf ? '<div class="content pdf"><iframe id="pdfv" title="' + esc(a.title) + '"></iframe></div>'
                      : '<div class="content-wrap">' + (canEdit ? EDIT_ICON : '') + '<div class="content" id="contentBox">' + reflow(DOMPurify.sanitize(a.html)) + '</div></div>') +
    (url ? '<p><a class="btn" href="' + url + '"' + (isPdf ? ' target="_blank" rel="noopener">Open PDF' : ' download>Download .docx') + '</a></p>' : '') + '</article>';
  if (isPdf) loadPdf(url);
  if (canEdit) setupEditor(a.id);
  if (!isPdf) initProgress(a.id, document.getElementById("contentBox"));
}); }
// ---------- Inline editor (admin only; saving is enforced by Supabase RLS) ----------
function setupEditor(articleId) {
  const box = document.getElementById("contentBox"), btn = document.getElementById("editBtn");
  let bar = null, original = "", dirty = false;
  const ico = {
    undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',
    redo:'<path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/>',
    space:'<path d="M12 5v14"/><path d="m8 15 4 4 4-4"/><path d="m8 9 4-4 4 4" opacity=".0"/>'
  };
  const tools = [
    ["p","¶","Normal paragraph"],["h1","H1","Heading 1 (largest)"],["h2","H2","Heading 2"],["h3","H3","Heading 3"],
    ["|"],
    ["bold","<b>B</b>","Bold (Ctrl+B)"],["italic","<i>I</i>","Italic (Ctrl+I)"],["underline","<u>U</u>","Underline (Ctrl+U)"],
    ["|"],
    ["quote","❝","Quote: turn selected lines into a poem quote (click again to remove)"],
    ["space","¶＋","Add an empty line (space) below"],
    ["unspace","¶－","Remove the empty line"],
    ["|"],
    ["undo","↶","Undo"],["redo","↷","Redo"]
  ];
  const blocksIn = () => {
    const sel = getSelection(); if (!sel.rangeCount) return [];
    const r = sel.getRangeAt(0), out = [];
    [...box.children].forEach(el => { if (r.intersectsNode(el)) out.push(el); });
    return out;
  };
  const inBox = () => { const s = getSelection(); return s.rangeCount && box.contains(s.anchorNode); };
  function toggleQuote() {
    const bl = blocksIn(); if (!bl.length) return;
    if (bl.every(b => b.tagName === "BLOCKQUOTE")) {            // unwrap
      bl.forEach(b => { while (b.firstChild) b.before(b.firstChild); b.remove(); });
      return;
    }
    const q = document.createElement("blockquote"); q.className = "poem";
    bl[0].before(q);
    bl.forEach(b => {
      if (b.tagName === "BLOCKQUOTE") { while (b.firstChild) q.append(b.firstChild); b.remove(); }
      else if (/^(P|DIV)$/.test(b.tagName)) { const line = document.createElement("p"); line.innerHTML = b.innerHTML; q.append(line); b.remove(); }
      else q.append(b);
    });
  }
  function addSpace() {
    const bl = blocksIn(), last = bl[bl.length - 1]; if (!last) return;
    const p = document.createElement("p"); p.innerHTML = "<br>"; last.after(p);
    getSelection().collapse(p, 0);
  }
  function removeSpace() {
    const bl = blocksIn(); if (!bl.length) return;
    const isEmpty = e => e && e.tagName === "P" && !e.textContent.trim() && !e.querySelector("img");
    const t = [bl[0], bl[0].nextElementSibling, bl[0].previousElementSibling].find(isEmpty);
    if (t) t.remove();
  }
  // ----- headings: each line is either a heading or a paragraph, never both in one block -----
  const HEAD = /^H[1-6]$/;
  const targets = () => {                       // selected blocks; lines inside a poem quote count individually
    const out = [];
    blocksIn().forEach(b => {
      if (b.tagName === "BLOCKQUOTE") { const r = getSelection().getRangeAt(0); [...b.children].forEach(c => { if (r.intersectsNode(c)) out.push(c); }); }
      else out.push(b);
    });
    return out;
  };
  function setBlock(tag) {
    const sel = getSelection(); if (!sel.rangeCount) return;
    const range = sel.getRangeAt(0).cloneRange(), made = [];
    const mk = (t, nodes) => {
      const el = document.createElement(t);
      nodes.forEach(n => el.append(n));
      if (t !== "p") {                                  // drop leftover font sizes/colours so same level = same size
        el.querySelectorAll("[style]").forEach(x => x.removeAttribute("style"));
        el.querySelectorAll("font").forEach(f => f.replaceWith(...f.childNodes));
      }
      if (!el.textContent.trim() && !el.querySelector("img")) el.innerHTML = "<br>";
      made.push(el); return el;
    };
    targets().forEach(b => {
      if (!/^(P|DIV|H[1-6])$/.test(b.tagName)) return;               // leave lists, tables, images alone
      const want = tag.toUpperCase();
      if (b.tagName === want) return;
      const hasBr = b.querySelector(":scope > br") && b.childNodes.length > 1;
      if (want !== "P" && hasBr) {                                    // paragraph made of several lines: only the chosen line(s) become headings
        const lines = [[]];
        [...b.childNodes].forEach(n => { if (n.nodeName === "BR") lines.push([]); else lines[lines.length - 1].push(n); });
        const hit = lines.map(l => l.length && l.some(n => range.intersectsNode(n)));
        if (!hit.some(Boolean)) hit[0] = true;
        const frag = document.createDocumentFragment(); let run = [];
        const flush = () => { if (!run.length) return; const p = document.createElement(b.tagName === "DIV" ? "div" : "p");
          run.forEach((l, i) => { if (i) p.append(document.createElement("br")); l.forEach(n => p.append(n)); }); frag.append(p); run = []; };
        lines.forEach((l, i) => { if (hit[i]) { flush(); frag.append(mk(want, l)); } else if (l.length) run.push(l); });
        flush(); b.replaceWith(frag);
      } else {
        const nodes = [...b.childNodes].filter(n => !(want !== "P" && n.nodeName === "BR" && n === b.lastChild));
        b.replaceWith(mk(want, nodes));
      }
    });
    if (made.length) { const r = document.createRange(); r.selectNodeContents(made[made.length - 1]); r.collapse(false); sel.removeAllRanges(); sel.addRange(r); }
  }
  function run(cmd) {
    box.focus();
    if (/^(p|h[1-3])$/.test(cmd)) setBlock(cmd);
    else if (cmd === "quote") toggleQuote();
    else if (cmd === "space") addSpace();
    else if (cmd === "unspace") removeSpace();
    else document.execCommand(cmd, false, null);
    dirty = true; sync();
  }
  function sync() {
    if (!bar) return;
    ["bold","italic","underline"].forEach(c => {
      const b = bar.querySelector('[data-cmd="' + c + '"]'); let on = false;
      try { on = inBox() && document.queryCommandState(c); } catch (e) {}
      b.classList.toggle("on", on);
    });
    const cur = inBox() ? targets()[0] : null, tg = cur ? cur.tagName.toLowerCase() : "";
    ["p","h1","h2","h3"].forEach(c => bar.querySelector('[data-cmd="' + c + '"]').classList.toggle("on", c === tg || (c === "p" && cur && cur.tagName === "DIV")));
    const q = bar.querySelector('[data-cmd="quote"]'), bl = inBox() ? blocksIn() : [];
    q.classList.toggle("on", bl.length > 0 && bl.every(b => b.tagName === "BLOCKQUOTE"));
  }
  function buildBar() {
    bar = document.createElement("div"); bar.className = "edit-bar";
    bar.innerHTML = tools.map(t => t[0] === "|" ? '<span class="sep"></span>' :
      '<button type="button" data-cmd="' + t[0] + '" title="' + esc(t[2]) + '" aria-label="' + esc(t[2]) + '">' + t[1] + '</button>').join("") +
      '<span class="grow"></span><span class="status" id="editStatus"></span>' +
      '<button type="button" class="cancel" id="editCancel">Cancel</button><button type="button" class="save" id="editSave">Save</button>';
    bar.addEventListener("mousedown", e => { if (e.target.closest("button")) e.preventDefault(); }); // keep text selection
    bar.addEventListener("click", e => {
      const b = e.target.closest("[data-cmd]"); if (b) run(b.dataset.cmd);
    });
    box.parentNode.insertBefore(bar, box);
    document.getElementById("editCancel").onclick = () => stop(false);
    document.getElementById("editSave").onclick = save;
  }
  function start() {
    original = box.innerHTML; dirty = false;
    document.execCommand("defaultParagraphSeparator", false, "p");
    // wrap any loose text/inline content in paragraphs so every line is a proper block
    [...box.childNodes].forEach(n => { if (n.nodeType === 3 ? n.textContent.trim() : /^(A|B|I|U|EM|STRONG|SPAN|BR)$/.test(n.nodeName)) { const p = document.createElement("p"); n.replaceWith(p); p.append(n); } });
    box.contentEditable = "true"; box.classList.add("editing"); btn.hidden = true;
    box.addEventListener("keydown", e => {            // Enter at the end of a heading starts a normal paragraph, not another heading
      if (e.key !== "Enter" || e.shiftKey) return;
      const sel = getSelection(); if (!sel.rangeCount || !sel.isCollapsed) return;
      let h = sel.anchorNode; while (h && h !== box && !HEAD.test(h.nodeName)) h = h.parentNode;
      if (!h || h === box) return;
      const tail = document.createRange(); tail.selectNodeContents(h); tail.setStart(sel.anchorNode, sel.anchorOffset);
      if (tail.toString().length) return;             // caret in the middle: normal split
      e.preventDefault();
      const p = document.createElement("p"); p.innerHTML = "<br>"; h.after(p);
      const r = document.createRange(); r.setStart(p, 0); r.collapse(true); sel.removeAllRanges(); sel.addRange(r); dirty = true; sync();
    });
    buildBar(); box.focus();
  }
  function stop(saved) {
    if (!saved) { if (dirty && !confirm("Discard your changes?")) return; box.innerHTML = original; }
    box.contentEditable = "false"; box.classList.remove("editing"); btn.hidden = false;
    if (bar) { bar.remove(); bar = null; } dirty = false;
  }
  async function save() {
    const st = document.getElementById("editStatus"), sv = document.getElementById("editSave");
    sv.disabled = true; st.textContent = "Saving…";
    const html = DOMPurify.sanitize(box.innerHTML);
    const {data, error} = await sb.from("articles").update({html}).eq("id", articleId).select("id");
    if (error || !data || !data.length) { st.textContent = "Could not save. Are you logged in as admin?"; sv.disabled = false; return; }
    box.innerHTML = html; try { localStorage.removeItem("ml:art:" + articleId); } catch (e) {} stop(true);
  }
  btn.onclick = start;
  document.addEventListener("selectionchange", sync);
  box.addEventListener("input", () => { dirty = true; });
  window.addEventListener("beforeunload", e => { if (bar && dirty) { e.preventDefault(); e.returnValue = ""; } });
}
function cfgProblem() {
  try { if (!sb) return "Setup error."; }
  catch (e) { return "config.js did not load or has a mistake. Upload config.js into the same GitHub folder as this page, and make sure the URL and key are inside quotes."; }
  if (SUPABASE_URL.includes("YOUR-PROJECT") || SUPABASE_ANON_KEY.includes("YOUR-ANON"))
    return "config.js still has the placeholder text. Put your real Supabase Project URL and publishable key in it, then upload it again.";
  return "";
}
function showProblem(m) { app.innerHTML = '<p class="flash"></p>'; app.firstChild.textContent = m; }
const bad = cfgProblem();
if (bad) showProblem(bad); else sb.auth.getSession().then(({data:{session}}) => { loggedIn = !!session; }, () => {}).then(() => (id ? showArticle() : fid ? showFolder() : showList()));
if (!bad) sb.auth.getSession().then(({data:{session}}) => {
  if (!session) return;
  const nav = document.getElementById("nav");
  nav.innerHTML = '<a href="admin.html"><b>Upload article</b></a><a href="#" id="out">Log out</a>';
  document.getElementById("out").onclick = async e => { e.preventDefault(); await sb.auth.signOut(); location.reload(); };
});
