<!doctype html><html lang="en"><head><title>Admin | malayalamoptional</title>
<meta name="robots" content="noindex">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650&family=Noto+Serif+Malayalam:wght@400;700&family=Noto+Sans+Malayalam:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script></head><body class="admin">
<header class="top"><a class="brand" href="./">malayalamoptional</a><nav id="nav"></nav></header>
<main id="app"></main>
<script src="config.js"></script>
<script>
const app = document.getElementById("app"), nav = document.getElementById("nav");
const note = m => { let n = document.getElementById("note"); if (n) n.textContent = m; };
async function init() {
  const {data:{session}} = await sb.auth.getSession();
  session ? showAdmin() : showLogin();
}
function showLogin() {
  nav.innerHTML = "";
  app.innerHTML = '<h1>Admin login</h1><p class="sub">Sign in to manage your articles.</p><form class="card" id="f">' +
    '<div class="field"><label for="em">Email</label><input type="email" id="em" autocomplete="username" required></div>' +
    '<div class="field"><label for="pw">Password</label><input type="password" id="pw" autocomplete="current-password" required></div>' +
    '<button class="cta">Log in</button><p id="note" class="flash" hidden></p></form>';
  document.getElementById("f").onsubmit = async e => {
    e.preventDefault();
    const {error} = await sb.auth.signInWithPassword({email: em.value, password: pw.value});
    if (error) { const n = document.getElementById("note"); n.hidden = false; n.textContent = "Wrong email or password."; } else init();
  };
}
async function showAdmin() {
  nav.innerHTML = '<a href="#" id="out">Log out</a>';
  document.getElementById("out").onclick = async e => { e.preventDefault(); await sb.auth.signOut(); init(); };
  app.innerHTML = '<h1>Upload an article</h1><p class="sub">Add a Word document and publish it in one step.</p><form class="card" id="f">' +
    '<div class="field"><label for="t">Title <span class="opt">(optional, defaults to file name)</span></label><input type="text" id="t" autocomplete="off"></div>' +
    '<div class="field"><label for="c">Category</label><select id="c">' + CATEGORIES.map(c => '<option>' + esc(c) + '</option>').join("") + '</select></div>' +
    '<div class="field"><span class="lbl">Word file</span><div class="drop" id="drop">' +
      '<input type="file" id="file" accept=".docx" required aria-label="Choose a Word file">' +
      '<span class="drop-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg></span>' +
      '<span class="drop-title" id="dropTitle">Drop your .docx here</span>' +
      '<span class="drop-hint" id="dropHint">or browse from your device</span>' +
      '<span class="btn-secondary" aria-hidden="true">Choose file</span></div></div>' +
    '<button class="cta" id="go">Publish</button>' +
    '<p id="note" class="flash" hidden></p></form><h2>Published</h2><ul class="list" id="list"></ul>';
  const form = document.getElementById("f"), drop = document.getElementById("drop"), fileIn = document.getElementById("file");
  const dropTitle = document.getElementById("dropTitle"), dropHint = document.getElementById("dropHint");
  const syncDrop = () => {
    const f = fileIn.files[0];
    drop.classList.toggle("has-file", !!f);
    dropTitle.textContent = f ? f.name : "Drop your .docx here";
    dropHint.textContent = f ? (f.size / 1024 < 1024 ? Math.round(f.size / 1024) + " KB" : (f.size / 1048576).toFixed(1) + " MB") + " · click to replace" : "or browse from your device";
  };
  fileIn.addEventListener("change", syncDrop);
  form.addEventListener("reset", () => setTimeout(syncDrop));
  ["dragenter", "dragover"].forEach(ev => fileIn.addEventListener(ev, () => drop.classList.add("over")));
  ["dragleave", "drop"].forEach(ev => fileIn.addEventListener(ev, () => drop.classList.remove("over")));
  form.onsubmit = upload;
  loadList();
}
async function upload(e) {
  e.preventDefault();
  const n = document.getElementById("note"), go = document.getElementById("go"), f = document.getElementById("file").files[0];
  n.hidden = false;
  if (!f || !f.name.toLowerCase().endsWith(".docx")) { n.textContent = "Choose a .docx file."; return; }
  go.disabled = true; n.textContent = "Converting and uploading…";
  try {
    const {value:html} = await mammoth.convertToHtml({arrayBuffer: await f.arrayBuffer()});
    const path = crypto.randomUUID() + ".docx";
    let r = await sb.storage.from("docx").upload(path, f, {contentType: f.type || "application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
    if (r.error) throw r.error;
    const title = document.getElementById("t").value.trim() || f.name.replace(/\.docx$/i, "");
    r = await sb.from("articles").insert({title, category: document.getElementById("c").value, html, file_path: path});
    if (r.error) { await sb.storage.from("docx").remove([path]); throw r.error; }
    n.textContent = "Published: " + title; document.getElementById("f").reset(); loadList();
  } catch (err) { n.textContent = "Upload failed: " + (err.message || err); }
  go.disabled = false;
}
async function loadList() {
  const {data} = await sb.from("articles").select("id,title,category,created_at,file_path").order("created_at", {ascending:false});
  const ul = document.getElementById("list");
  ul.innerHTML = (data && data.length) ? data.map(r => '<li><a href="index.html?id=' + r.id + '">' + esc(r.title) + '</a><span>' +
    esc(r.category) + ', ' + fmt(r.created_at) + '</span><button class="danger" data-id="' + r.id + '" data-p="' + esc(r.file_path || "") + '">Delete</button></li>').join("")
    : '<li class="empty">Nothing uploaded yet.</li>';
  ul.querySelectorAll("button").forEach(b => b.onclick = async () => {
    if (!confirm("Delete this article?")) return;
    await sb.from("articles").delete().eq("id", b.dataset.id);
    if (b.dataset.p) await sb.storage.from("docx").remove([b.dataset.p]);
    loadList();
  });
}
function cfgProblem() {
  try { if (!sb) return "Setup error."; }
  catch (e) { return "config.js did not load or has a mistake. Upload config.js into the same GitHub folder as this page, and make sure the URL and key are inside quotes."; }
  if (SUPABASE_URL.includes("YOUR-PROJECT") || SUPABASE_ANON_KEY.includes("YOUR-ANON"))
    return "config.js still has the placeholder text. Put your real Supabase Project URL and publishable key in it, then upload it again.";
  return "";
}
function showProblem(m) { app.innerHTML = '<p class="flash"></p>'; app.firstChild.textContent = m; }
const bad = cfgProblem();
if (bad) showProblem(bad); else init().catch(e => showProblem("Error: " + (e.message || e)));
</script></body></html>
