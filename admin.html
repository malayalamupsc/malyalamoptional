<!doctype html><html lang="en"><head><title>Admin | malayalamoptional</title>
<meta name="robots" content="noindex">
<meta charset="utf-8"><script src="theme.js"></script><script src="fullscreen.js"></script><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650&family=Noto+Serif+Malayalam:wght@400;700&family=Noto+Sans+Malayalam:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="card.css">
<link rel="stylesheet" href="theme.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script></head><body class="admin">
<header class="top"><a class="brand" href="./"><img src="logo.png" alt="" width="70" height="38"><span>malayalamoptional</span></a><nav id="nav"></nav></header>
<main id="app"></main>
<script src="config.js"></script>
<script src="card.js"></script>
<script>
const app = document.getElementById("app"), nav = document.getElementById("nav");
const note = m => { let n = document.getElementById("note"); if (n) n.textContent = m; };
async function init() {
  const {data:{session}} = await sb.auth.getSession();
  session ? showAdmin() : showLogin();
}
function showLogin() {
  nav.innerHTML = "";
  app.innerHTML = '<h1>Admin login</h1><p class="sub">Sign in to manage your articles.</p><form class="card" id="f">' +
    '<div class="field"><label for="em">Email</label><input type="email" id="em" autocomplete="username" required></div>' +
    '<div class="field"><label for="pw">Password</label><input type="password" id="pw" autocomplete="current-password" required></div>' +
    '<button class="cta">Log in</button><p id="note" class="flash" hidden></p></form>';
  document.getElementById("f").onsubmit = async e => {
    e.preventDefault();
    const {error} = await sb.auth.signInWithPassword({email: em.value, password: pw.value});
    if (error) { const n = document.getElementById("note"); n.hidden = false; n.textContent = "Wrong email or password."; } else init();
  };
}
async function showAdmin() {
  nav.innerHTML = '<a href="#" id="out">Log out</a>';
  document.getElementById("out").onclick = async e => { e.preventDefault(); await sb.auth.signOut(); init(); };
  app.innerHTML = '<h1>Upload an article</h1><p class="sub">Add a Word document and publish it in one step.</p><form class="card" id="f">' +
    '<div class="field"><label for="t">Title <span class="opt">(optional, defaults to file name)</span></label><input type="text" id="t" autocomplete="off"></div>' +
    '<div class="field"><label for="c">Category</label><select id="c">' + CATEGORIES.map(c => '<option>' + esc(c) + '</option>').join("") + '</select></div>' +
    '<div class="field" id="fofield" hidden><label for="fo">Collection <span class="opt">(optional)</span></label><select id="fo"></select></div>' +
    '<div class="field"><span class="lbl">File (Word or PDF)</span><div class="drop" id="drop">' +
      '<input type="file" id="file" accept=".docx,.pdf,application/pdf" required aria-label="Choose a Word or PDF file">' +
      '<span class="drop-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg></span>' +
      '<span class="drop-title" id="dropTitle">Drop your .docx or .pdf here</span>' +
      '<span class="drop-hint" id="dropHint">or browse from your device</span>' +
      '<span class="btn-secondary" aria-hidden="true">Choose file</span></div></div>' +
    '<button class="cta" id="go">Publish</button>' +
    '<p id="note" class="flash" hidden></p></form>' +
    '<h2>Collections</h2><form class="card" id="cf"><p class="hint">Each collection shows on the site as a card. Add a picture and the text for it.</p>' +
    '<div class="field"><label for="cn">Card title</label><input type="text" id="cn" autocomplete="off" placeholder="e.g. Kannassa Ramayanam"></div>' +
    '<div class="field"><label for="cd">Description <span class="opt">(optional)</span></label><textarea id="cd" rows="3" placeholder="A short line about this collection"></textarea></div>' +
    '<div class="field"><label for="cbt">Button text</label><input type="text" id="cbt" value="Explore" autocomplete="off"></div>' +
    '<div class="field"><span class="lbl">Card image</span><div class="drop" id="cdrop">' +
      '<input type="file" id="cimg" accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp" aria-label="Choose a card image">' +
      '<span class="drop-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4.5 3.5 3 3-2.5 4.5 4"/></svg></span>' +
      '<span class="drop-title" id="cdt">Drop an image here</span><span class="drop-hint" id="cdh">PNG, JPG or WebP · landscape (4:3) looks best</span>' +
      '<span class="btn-secondary" aria-hidden="true">Choose image</span></div>' +
      '<button type="button" class="ghost-btn" id="crm" hidden>Remove current image</button></div>' +
    '<div class="field"><span class="lbl">Preview</span><div class="prev" id="cprev"></div></div>' +
    '<div class="btns"><button class="cta" id="cb">Create collection</button><button type="button" class="sec" id="cc" hidden>Cancel</button></div>' +
    '<p id="cnote" class="flash" hidden></p></form><ul class="list" id="flist"></ul>' +
    '<h2>Published</h2><ul class="list" id="list"></ul>';
  const form = document.getElementById("f"), drop = document.getElementById("drop"), fileIn = document.getElementById("file");
  const dropTitle = document.getElementById("dropTitle"), dropHint = document.getElementById("dropHint");
  const syncDrop = () => {
    const f = fileIn.files[0];
    drop.classList.toggle("has-file", !!f);
    dropTitle.textContent = f ? f.name : "Drop your .docx or .pdf here";
    dropHint.textContent = f ? (f.size / 1024 < 1024 ? Math.round(f.size / 1024) + " KB" : (f.size / 1048576).toFixed(1) + " MB") + " · click to replace" : "or browse from your device";
  };
  fileIn.addEventListener("change", syncDrop);
  form.addEventListener("reset", () => setTimeout(syncDrop));
  ["dragenter", "dragover"].forEach(ev => fileIn.addEventListener(ev, () => drop.classList.add("over")));
  ["dragleave", "drop"].forEach(ev => fileIn.addEventListener(ev, () => drop.classList.remove("over")));
  form.onsubmit = upload;
  document.getElementById("cf").onsubmit = saveFolder;
  document.getElementById("cc").onclick = resetFolderForm;
  ["cn", "cd", "cbt"].forEach(i => document.getElementById(i).addEventListener("input", renderPreview));
  const cimg = document.getElementById("cimg"), cdrop = document.getElementById("cdrop");
  cimg.addEventListener("change", () => {
    const f = cimg.files[0];
    if (cardImg.url) URL.revokeObjectURL(cardImg.url);
    cardImg.file = f || null; cardImg.url = f ? URL.createObjectURL(f) : null; cardImg.remove = false;
    cdrop.classList.toggle("has-file", !!f);
    document.getElementById("cdt").textContent = f ? f.name : "Drop an image here";
    document.getElementById("cdh").textContent = f ? "click to replace" : "PNG, JPG or WebP · landscape (4:3) looks best";
    renderPreview();
  });
  ["dragenter", "dragover"].forEach(ev => cimg.addEventListener(ev, () => cdrop.classList.add("over")));
  ["dragleave", "drop"].forEach(ev => cimg.addEventListener(ev, () => cdrop.classList.remove("over")));
  document.getElementById("crm").onclick = () => { cardImg.remove = true; renderPreview(); };
  await loadFolders();
  loadList();
}
let FOLDERS = [], foldersOk = true, cardsOk = true, editingId = null;
const cardImg = {file: null, url: null, existing: null, remove: false};
const folderOptions = sel => '<option value="">No collection</option>' + FOLDERS.map(f =>
  '<option value="' + esc(f.id) + '"' + (f.id === sel ? " selected" : "") + '>' + esc(f.name) + '</option>').join("");
async function loadFolders() {
  const r = await sb.from("folders").select("*").order("created_at");
  foldersOk = !r.error; FOLDERS = r.error ? [] : r.data;
  // Card image/text columns come from the updated SQL; check they exist.
  cardsOk = foldersOk && !(await sb.from("folders").select("description,button_text,image_path").limit(1)).error;
  renderFolders();
}
function renderPreview() {
  const f = editingId ? FOLDERS.find(x => x.id === editingId) : null;
  const cnt = f ? document.querySelectorAll('#list select.mv option[value="' + f.id + '"]:checked').length : 0;
  const img = cardImg.url || (!cardImg.remove && cardImg.existing ? cardImgUrl(cardImg.existing) : null);
  document.getElementById("cprev").innerHTML = cardHtml({
    title: document.getElementById("cn").value.trim(), desc: document.getElementById("cd").value.trim(),
    btn: document.getElementById("cbt").value.trim(), img, badge: cnt + (cnt === 1 ? " article" : " articles")});
  document.getElementById("crm").hidden = !(cardImg.existing && !cardImg.remove && !cardImg.url);
}
function renderFolders() {
  const fl = document.getElementById("flist"), cf = document.getElementById("cf"), fo = document.getElementById("fo");
  if (!foldersOk || !cardsOk) {
    cf.hidden = true; document.getElementById("fofield").hidden = !foldersOk || !FOLDERS.length;
    fl.innerHTML = '<li class="empty">Collections need a one-time database update. Open the Supabase SQL Editor, run the latest supabase-folders.sql, then reload this page.</li>';
    if (foldersOk) fo.innerHTML = folderOptions(fo.value);
    return;
  }
  cf.hidden = false;
  const keep = fo.value;
  fo.innerHTML = folderOptions(keep);
  document.getElementById("fofield").hidden = !FOLDERS.length;
  fl.innerHTML = FOLDERS.length ? FOLDERS.map(f => {
    const u = cardImgUrl(f.image_path);
    return '<li><img class="fi" src="' + esc(u || "favicon.png") + '" alt="" width="56" height="44"><span class="fn">' + esc(f.name) +
      '</span><button type="button" class="ghost-btn" data-e="' + esc(f.id) + '">Edit</button><button type="button" class="danger" data-d="' + esc(f.id) + '">Delete</button></li>';
  }).join("") : '<li class="empty">No collections yet. Create your first one above.</li>';
  fl.querySelectorAll("[data-e]").forEach(b => b.onclick = () => {
    const f = FOLDERS.find(x => x.id === b.dataset.e); if (!f) return;
    editingId = f.id;
    document.getElementById("cn").value = f.name || "";
    document.getElementById("cd").value = f.description || "";
    document.getElementById("cbt").value = f.button_text || "Explore";
    clearPicked(); cardImg.existing = f.image_path || null; cardImg.remove = false;
    document.getElementById("cb").textContent = "Save changes"; document.getElementById("cc").hidden = false;
    renderPreview();
    document.getElementById("cf").scrollIntoView({behavior: "smooth", block: "center"}); document.getElementById("cn").focus();
  });
  fl.querySelectorAll("[data-d]").forEach(b => b.onclick = async () => {
    if (!confirm("Delete this collection? Its articles are kept and will show as normal articles.")) return;
    const f = FOLDERS.find(x => x.id === b.dataset.d);
    const r = await sb.from("folders").delete().eq("id", b.dataset.d);
    if (r.error) { alert("Could not delete: " + r.error.message); return; }
    if (f && f.image_path) await sb.storage.from("docx").remove([f.image_path]);
    if (editingId === b.dataset.d) resetFolderForm();
    await loadFolders(); loadList();
  });
  renderPreview();
}
function clearPicked() {
  if (cardImg.url) URL.revokeObjectURL(cardImg.url);
  cardImg.file = null; cardImg.url = null;
  const i = document.getElementById("cimg"); if (i) i.value = "";
  const t = document.getElementById("cdt"); if (t) { t.textContent = "Drop an image here"; document.getElementById("cdh").textContent = "PNG, JPG or WebP · landscape (4:3) looks best"; }
  const d = document.getElementById("cdrop"); if (d) d.classList.remove("has-file");
}
function resetFolderForm() {
  editingId = null; clearPicked(); cardImg.existing = null; cardImg.remove = false;
  document.getElementById("cn").value = ""; document.getElementById("cd").value = ""; document.getElementById("cbt").value = "Explore";
  document.getElementById("cb").textContent = "Create collection"; document.getElementById("cc").hidden = true;
  renderPreview();
}
// Shrink big photos before upload so cards load fast.
async function shrinkImage(file) {
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1200 / bmp.width), w = Math.round(bmp.width * k), h = Math.round(bmp.height * k);
    const cv = document.createElement("canvas"); cv.width = w; cv.height = h; cv.getContext("2d").drawImage(bmp, 0, 0, w, h);
    const blob = await new Promise(r => cv.toBlob(r, "image/webp", 0.86));
    if (blob) return {blob, ext: "webp", type: "image/webp"};
  } catch (e) {}
  const ext = ((file.name.match(/\.(png|jpe?g|webp)$/i) || [])[1] || "png").toLowerCase();
  return {blob: file, ext, type: file.type || "image/png"};
}
async function saveFolder(e) {
  e.preventDefault();
  const n = document.getElementById("cnote"), go = document.getElementById("cb"), name = document.getElementById("cn").value.trim();
  n.hidden = false;
  if (!name) { n.textContent = "Enter a card title."; return; }
  go.disabled = true; n.textContent = "Saving…";
  let newPath = null, image_path = cardImg.remove ? null : cardImg.existing;
  try {
    if (cardImg.file) {
      const {blob, ext, type} = await shrinkImage(cardImg.file);
      newPath = "cards/" + crypto.randomUUID() + "." + ext;
      const up = await sb.storage.from("docx").upload(newPath, blob, {contentType: type});
      if (up.error) throw up.error;
      image_path = newPath;
    }
    const row = {name, description: document.getElementById("cd").value.trim() || null,
      button_text: document.getElementById("cbt").value.trim() || "Explore", image_path};
    const r = editingId ? await sb.from("folders").update(row).eq("id", editingId) : await sb.from("folders").insert(row);
    if (r.error) throw r.error;
    if (cardImg.existing && image_path !== cardImg.existing) await sb.storage.from("docx").remove([cardImg.existing]);
    n.textContent = editingId ? "Saved." : "Collection created.";
    resetFolderForm(); await loadFolders(); loadList();
  } catch (err) {
    if (newPath) await sb.storage.from("docx").remove([newPath]);
    n.textContent = "Could not save: " + (err.message || err);
  }
  go.disabled = false;
}
async function upload(e) {
  e.preventDefault();
  const n = document.getElementById("note"), go = document.getElementById("go"), f = document.getElementById("file").files[0];
  n.hidden = false;
  const ext = f ? (f.name.toLowerCase().match(/\.(docx|pdf)$/) || [])[1] : null;
  if (!ext) { n.textContent = "Choose a .docx or .pdf file."; return; }
  go.disabled = true; n.textContent = ext === "pdf" ? "Uploading…" : "Converting and uploading…";
  try {
    const html = ext === "pdf" ? "" : (await mammoth.convertToHtml({arrayBuffer: await f.arrayBuffer()})).value;
    const path = crypto.randomUUID() + "." + ext;
    const type = ext === "pdf" ? "application/pdf" : (f.type || "application/vnd.openxmlformats-officedocument.wordprocessingml.document");
    let r = await sb.storage.from("docx").upload(path, f, {contentType: type});
    if (r.error) throw r.error;
    const title = document.getElementById("t").value.trim() || f.name.replace(/\.(docx|pdf)$/i, "");
    const row = {title, category: document.getElementById("c").value, html, file_path: path};
    const fv = document.getElementById("fo").value; if (fv) row.folder_id = fv;
    r = await sb.from("articles").insert(row);
    if (r.error) { await sb.storage.from("docx").remove([path]); throw r.error; }
    const keepFolder = document.getElementById("fo").value;
    n.textContent = "Published: " + title; document.getElementById("f").reset(); document.getElementById("fo").value = keepFolder; loadList();
  } catch (err) { n.textContent = "Upload failed: " + (err.message || err); }
  go.disabled = false;
}
async function loadList() {
  let {data, error} = await sb.from("articles").select("id,title,category,created_at,file_path,folder_id").order("created_at", {ascending:false});
  if (error) ({data} = await sb.from("articles").select("id,title,category,created_at,file_path").order("created_at", {ascending:false}));
  const ul = document.getElementById("list");
  ul.innerHTML = (data && data.length) ? data.map(r => '<li><a href="index.html?id=' + r.id + '">' + esc(r.title) + '</a><span>' +
    esc(r.category) + ', ' + fmt(r.created_at) + '</span>' +
    (FOLDERS.length ? '<select class="mv" data-m="' + esc(r.id) + '" aria-label="Move to collection">' + folderOptions(r.folder_id) + '</select>' : '') +
    '<button class="danger" data-id="' + r.id + '" data-p="' + esc(r.file_path || "") + '">Delete</button></li>').join("")
    : '<li class="empty">Nothing uploaded yet.</li>';
  ul.querySelectorAll("select[data-m]").forEach(s => s.onchange = async () => {
    const r = await sb.from("articles").update({folder_id: s.value || null}).eq("id", s.dataset.m);
    if (r.error) { alert("Could not move: " + r.error.message); loadList(); }
  });
  ul.querySelectorAll("button").forEach(b => b.onclick = async () => {
    if (!confirm("Delete this article?")) return;
    await sb.from("articles").delete().eq("id", b.dataset.id);
    if (b.dataset.p) await sb.storage.from("docx").remove([b.dataset.p]);
    loadList();
  });
}
function cfgProblem() {
  try { if (!sb) return "Setup error."; }
  catch (e) { return "config.js did not load or has a mistake. Upload config.js into the same GitHub folder as this page, and make sure the URL and key are inside quotes."; }
  if (SUPABASE_URL.includes("YOUR-PROJECT") || SUPABASE_ANON_KEY.includes("YOUR-ANON"))
    return "config.js still has the placeholder text. Put your real Supabase Project URL and publishable key in it, then upload it again.";
  return "";
}
function showProblem(m) { app.innerHTML = '<p class="flash"></p>'; app.firstChild.textContent = m; }
const bad = cfgProblem();
if (bad) showProblem(bad); else init().catch(e => showProblem("Error: " + (e.message || e)));
</script></body></html>
